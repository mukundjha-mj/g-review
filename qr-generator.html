<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Review QR Generator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #17233a; background: linear-gradient(135deg, #f7faff, #e6f0ff); }
    .card { width: min(100%, 530px); padding: 28px; border-radius: 22px; background: #fff; box-shadow: 0 14px 40px #214c8530; }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p { color: #5d6b82; line-height: 1.5; }
    label { display: block; margin: 22px 0 8px; font-weight: 700; }
    input { width: 100%; padding: 14px; border: 1px solid #ced8e8; border-radius: 12px; font: inherit; color: #17233a; }
    input:focus { outline: 3px solid #2675ed33; border-color: #2675ed; }
    button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #2879e7, #1557dd); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { filter: brightness(1.05); }
    .error { min-height: 22px; margin: 10px 0 0; color: #c5221f; font-size: .9rem; }
    #result { display: none; margin-top: 26px; padding-top: 22px; border-top: 1px solid #e5eaf2; text-align: center; }
    #qrImage { display: block; width: min(100%, 280px); margin: 16px auto; padding: 12px; border: 2px solid #2879e7; border-radius: 14px; }
    .print { background: #fff; color: #1557dd; border: 1px solid #1557dd; }
    .small { overflow-wrap: anywhere; font-size: .8rem; }
    @media print { body { padding: 0; background: #fff; } .card > :not(#result), #result .print { display: none; } .card { box-shadow: none; } #result { display: block; border: 0; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Google Review QR Generator</h1>
    <p>Paste your Google Business review link. The QR code will open your review card first, then its button opens that exact Google link.</p>

    <label for="businessName">Business name <span aria-hidden="true">(optional)</span></label>
    <input id="businessName" type="text" placeholder="Spice Garden" autocomplete="organization">

    <label for="reviewUrl">Google review or business link</label>
    <input id="reviewUrl" type="url" placeholder="https://search.google.com/local/writereview?..." required>
    <p class="error" id="error" role="alert"></p>

    <button id="generate" type="button">Generate QR Code</button>

    <section id="result" aria-live="polite">
      <h2 id="resultName">Scan to leave a review</h2>
      <img id="qrImage" alt="Google review QR code">
      <p class="small" id="resultUrl"></p>
      <button class="print" type="button" onclick="window.print()">Print QR Code</button>
    </section>
  </main>

  <script>
    const reviewUrl = document.getElementById('reviewUrl');
    const businessName = document.getElementById('businessName');
    const error = document.getElementById('error');
    const result = document.getElementById('result');

    document.getElementById('generate').addEventListener('click', () => {
      error.textContent = '';
      const isLocalTest = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (location.protocol !== 'https:' && !isLocalTest) {
        error.textContent = 'Open this page on localhost for testing or host it on an https:// website.';
        return;
      }
      let destination;
      try { destination = new URL(reviewUrl.value.trim()); }
      catch { error.textContent = 'Paste a valid full link beginning with https://'; return; }

      if (destination.protocol !== 'https:') {
        error.textContent = 'Please use a secure https:// Google link.';
        return;
      }

      const name = businessName.value.trim();
      const landingPage = new URL('index.html', location.href);
      landingPage.searchParams.set('review', destination.href);
      if (name) landingPage.searchParams.set('business', name);
      document.getElementById('resultName').textContent = name ? `Review ${name}` : 'Scan to leave a review';
      document.getElementById('resultUrl').textContent = landingPage.href;
      document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&data=${encodeURIComponent(landingPage.href)}`;
      result.style.display = 'block';
    });
  </script>
</body>
</html>
